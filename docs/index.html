<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Education Atlas — higher-education game programmes worldwide</title>
<meta name="description" content="Higher-education game development, game design and game art programmes worldwide. Every record verified from the institution's own website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;650;750&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --surface-0: #f3f6f5;
  --surface-1: #ffffff;
  --surface-2: #e8efec;
  --line:      #c9d5d0;
  --line-soft: #dce6e1;
  --text-1:    #102018;
  --text-2:    #3d5248;
  --text-3:    #6d8177;
  --accent:    #0d9b82;
  --accent-2:  #e8910c;
  --accent-bg: #d8f3ec;
  --accent-ink:#065f4e;
  --amber-ink: #5a3a00;
  --amber-bg:  #f8e2b8;
  --good:      #1a8f3c;
  --hero-a:    #0a3d36;
  --hero-b:    #0f6b5c;
  --hero-c:    #148f7a;
  --radius:    8px;
  --font-d:    "Outfit", system-ui, sans-serif;
  --font-b:    "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface-0: #0c1210;
    --surface-1: #141c19;
    --surface-2: #1c2823;
    --line:      #2a3a34;
    --line-soft: #22302b;
    --text-1:    #eef5f1;
    --text-2:    #a8bdb3;
    --text-3:    #6f857b;
    --accent:    #2dcfb0;
    --accent-2:  #f0a93a;
    --accent-bg: #14352e;
    --accent-ink:#9aebd8;
    --amber-ink: #ffe6b0;
    --amber-bg:  #3d2e12;
    --good:      #4dce6e;
    --hero-a:    #061814;
    --hero-b:    #0a2f28;
    --hero-c:    #0e4a3e;
  }
}
:root[data-theme="dark"] {
  --surface-0: #0c1210; --surface-1: #141c19; --surface-2: #1c2823;
  --line: #2a3a34; --line-soft: #22302b;
  --text-1: #eef5f1; --text-2: #a8bdb3; --text-3: #6f857b;
  --accent: #2dcfb0; --accent-2: #f0a93a; --accent-bg: #14352e; --accent-ink: #9aebd8;
  --amber-ink: #ffe6b0; --amber-bg: #3d2e12;
  --good: #4dce6e;
  --hero-a: #061814; --hero-b: #0a2f28; --hero-c: #0e4a3e;
}
:root[data-theme="light"] {
  --surface-0: #f3f6f5; --surface-1: #ffffff; --surface-2: #e8efec;
  --line: #c9d5d0; --line-soft: #dce6e1;
  --text-1: #102018; --text-2: #3d5248; --text-3: #6d8177;
  --accent: #0d9b82; --accent-2: #e8910c; --accent-bg: #d8f3ec; --accent-ink: #065f4e;
  --amber-ink: #5a3a00; --amber-bg: #f8e2b8;
  --good: #1a8f3c;
  --hero-a: #0a3d36; --hero-b: #0f6b5c; --hero-c: #148f7a;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-1);
  font: 14.5px/1.45 var(--font-b);
  -webkit-font-smoothing: antialiased;
  background-image:
    linear-gradient(rgba(13,155,130,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(13,155,130,0.04) 1px, transparent 1px);
  background-size: 28px 28px;
}
a { color: var(--accent); }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

/* ---------- top bar ---------- */
header {
  background: linear-gradient(120deg, var(--hero-a), var(--hero-b) 55%, var(--hero-c));
  color: #eef8f4;
  position: relative;
  overflow: hidden;
}
header::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    radial-gradient(circle at 12% 40%, rgba(232,145,12,0.22), transparent 28%),
    radial-gradient(circle at 88% 20%, rgba(45,207,176,0.18), transparent 32%),
    repeating-linear-gradient(-18deg, transparent, transparent 11px, rgba(255,255,255,0.03) 11px, rgba(255,255,255,0.03) 12px);
  pointer-events: none;
}
.üst {
  position: relative; z-index: 1;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0 0; flex-wrap: wrap;
}
.marka {
  font-family: var(--font-d); font-weight: 750; font-size: 15px;
  letter-spacing: -0.02em; margin-right: auto; color: #fff;
}
.marka span { color: rgba(238,248,244,0.62); font-weight: 500; font-size: 12.5px; }
.düğme {
  font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.28); background: rgba(0,0,0,0.18);
  color: #eef8f4; cursor: pointer;
}
.düğme:hover { background: rgba(255,255,255,0.12); }
.düğme.açık { background: var(--accent-2); border-color: var(--accent-2); color: #1a1200; font-weight: 700; }
.dil { display: inline-flex; border: 1px solid rgba(255,255,255,0.28); border-radius: 6px; overflow: hidden; }
.dil button { border: 0; border-radius: 0; background: transparent; }
.dil button + button { border-left: 1px solid rgba(255,255,255,0.28); }

/* ---------- hero (compact) ---------- */
.giriş { position: relative; z-index: 1; padding: 12px 0 14px; color: #eef8f4; }
.giriş h1 {
  font-family: var(--font-d); font-weight: 750;
  font-size: clamp(1.35rem, 2.6vw, 1.75rem); line-height: 1.15;
  margin: 0 0 6px; letter-spacing: -0.03em; max-width: 28ch; color: #fff;
}
.giriş p {
  margin: 0; color: rgba(238,248,244,0.78); font-size: 13px; line-height: 1.4;
  max-width: 68ch;
}
.giriş .bağlar { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.bağ {
  display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600;
  text-decoration: none; border: 1px solid rgba(255,255,255,0.28); color: #eef8f4;
  background: rgba(0,0,0,0.16);
  transition: transform .15s ease, background .15s ease;
}
.bağ.ana { background: var(--accent-2); border-color: var(--accent-2); color: #1a1200; }
.bağ:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
.bağ.ana:hover { filter: brightness(1.06); background: var(--accent-2); }

/* ---------- filters ---------- */
.süzgeç {
  padding: 10px 0 6px; position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--surface-0) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.ara {
  width: 100%; font: inherit; padding: 8px 11px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface-1); color: var(--text-1);
}
.ara:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.filtre-satır {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px;
}
.alan { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.etiket {
  font-family: var(--font-d); font-size: 10.5px; font-weight: 650;
  letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3);
}
.sec {
  font: inherit; font-size: 13px; padding: 6px 28px 6px 9px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--surface-1); color: var(--text-1);
  width: 100%; min-width: 0;
  appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%236d8177' d='M1 1l5 5 5-5'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center;
  cursor: pointer;
}
.sec:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.sayaç {
  font-family: var(--font-d); font-size: 11.5px; font-weight: 650;
  color: var(--accent-ink); padding: 6px 0 0; letter-spacing: 0.01em;
}

/* ---------- cards (dense) ---------- */
.liste { padding: 4px 0 48px; }
.kart {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px 10px 14px; margin: 7px 0;
  background: var(--surface-1);
  border-left: 3px solid var(--line);
  transition: border-color .15s ease, transform .15s ease;
  animation: kartGir .35s ease both;
}
.kart:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-1px); }
.kart.odak-yuksek { border-left-color: var(--accent); }
.kart.odak-orta { border-left-color: var(--accent-2); }
.kart.myo-var { box-shadow: inset 0 0 0 0 transparent; }
@keyframes kartGir {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.kart-üst {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  margin-bottom: 4px;
}
.kart h2 {
  font-family: var(--font-d); font-weight: 650; font-size: 15px;
  margin: 0; letter-spacing: -0.02em; line-height: 1.25;
}
.yer { color: var(--text-3); font-size: 12px; }
.rozetler { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0 5px; }
.rozet {
  font-family: var(--font-d); font-size: 10.5px; font-weight: 650;
  padding: 1px 7px; border-radius: 4px; letter-spacing: 0.02em;
  border: 1px solid var(--line); color: var(--text-2); background: var(--surface-2);
}
.rozet.oyun { border-color: transparent; color: var(--accent-ink); background: var(--accent-bg); }
.rozet.myo { border-color: transparent; color: #fff; background: var(--good); }
.rozet.dil { border-color: transparent; color: var(--amber-ink); background: var(--amber-bg); }
.prog {
  font-weight: 700; font-size: 13.5px; margin: 0 0 5px; color: var(--text-1); line-height: 1.3;
}
.meta {
  display: flex; flex-wrap: wrap; gap: 3px 0; margin: 0 0 4px;
  font-size: 12.5px; color: var(--text-2); line-height: 1.35;
}
.meta span { display: inline; }
.meta span + span::before {
  content: "·"; margin: 0 6px; color: var(--text-3); font-weight: 700;
}
.meta b { font-weight: 600; color: var(--text-3); font-size: 11px; margin-right: 3px; }
.meta em { font-style: normal; color: var(--text-3); font-size: 11.5px; }
details { margin-top: 4px; border-top: 1px solid var(--line-soft); padding-top: 3px; }
summary {
  cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-2);
  padding: 2px 0; list-style: none;
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; display: inline-block; width: 1em; color: var(--accent); font-weight: 700; }
details[open] summary::before { content: "−"; }
summary:hover { color: var(--text-1); }
details ul { margin: 4px 0 2px; padding-left: 16px; font-size: 13px; }
details li { margin: 1px 0; }
details p { font-size: 13px; margin: 4px 0 0; }
.kişi b { font-weight: 600; }
.kişi em { font-style: normal; color: var(--text-2); }
.açıklama {
  margin: 6px 0 0; padding: 6px 9px; background: var(--surface-2);
  border-radius: 6px; font-size: 12.5px; color: var(--text-2); line-height: 1.4;
  border-left: 2px solid var(--accent-2);
}
.kaynak { margin: 5px 0 0; font-size: 11.5px; color: var(--text-3); word-break: break-all; }
.kaynak a { color: var(--text-3); }
.kaynak a:hover { color: var(--accent); }
.sayfa-bağ { margin: 6px 0 0; font-size: 13px; font-weight: 600; }
.boş { text-align: center; padding: 40px 0; color: var(--text-2); }

footer {
  border-top: 1px solid var(--line); background: var(--surface-1);
  padding: 18px 0 28px; color: var(--text-2); font-size: 13px;
}
footer p { margin: 0 0 6px; max-width: 70ch; }
[hidden] { display: none !important; }

@media (max-width: 720px) {
  .wrap { padding: 0 12px; }
  .üst { gap: 6px; }
  .marka { font-size: 14px; width: 100%; margin: 0; }
  .giriş { padding: 8px 0 12px; }
  .giriş h1 { font-size: 1.25rem; max-width: none; }
  .filtre-satır { grid-template-columns: 1fr; }
  .kart { padding: 9px 10px 9px 11px; }
  .kart h2 { font-size: 14.5px; }
  footer { padding: 14px 0 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .kart { animation: none; }
  .bağ, .kart { transition: none; }
}
</style>
</head>
<body>

<header>
  <div class="wrap üst">
    <div class="marka">Game Education Atlas <span data-t="marka"></span></div>
    <div class="dil" role="group" aria-label="Language">
      <button class="düğme" data-dil="en">EN</button>
      <button class="düğme" data-dil="tr">TR</button>
    </div>
    <button class="düğme" id="tema" title="Light / dark">◐</button>
  </div>
  <section class="giriş">
    <div class="wrap">
      <h1 data-t="baslik"></h1>
      <p data-t="ozet"></p>
      <div class="bağlar">
        <a class="bağ ana" id="bag-pdf" href="https://github.com/gusanmaz/game-education-atlas/raw/main/catalogue/oyun-programlari.pdf" data-t="pdf"></a>
        <a class="bağ" id="bag-md" href="https://github.com/gusanmaz/game-education-atlas/blob/main/catalogue/OYUN-PROGRAMLARI.md" data-t="md"></a>
        <a class="bağ" href="https://github.com/gusanmaz/game-education-atlas" data-t="repo"></a>
        <a class="bağ" href="https://github.com/gusanmaz/game-education-atlas/blob/main/CONTRIBUTING.md" data-t="katki"></a>
      </div>
    </div>
  </section>
</header>

<section class="süzgeç">
  <div class="wrap">
    <input class="ara" id="ara" type="search" autocomplete="off">
    <div class="filtre-satır">
      <div class="alan" id="ulkeler"></div>
      <div class="alan" id="sinirlar"></div>
    </div>
    <div class="sayaç" id="sayac"></div>
  </div>
</section>

<main class="wrap liste" id="liste"></main>

<footer>
  <div class="wrap">
    <p data-t="altbilgi1"></p>
    <p data-t="altbilgi2"></p>
  </div>
</footer>

<script src="data.js"></script>
<script>
"use strict";

const METIN = {
  en: {
    marka: "· higher-education game programmes",
    baslik: "Where game development is taught, and by whom",
    ozet: "",
    pdf: "PDF", md: "Markdown", repo: "GitHub", katki: "Contribute",
    ara: "Search institution, city, course, professor, lab…",
    ulke: "Country", sinir: "Filter",
    hepsi: "All countries", sinirHepsi: "No filter",
    oyunBolum: "Dedicated game programme", ingilizce: "Taught in English",
    myoSeviye: "Short-cycle / associate level", hocaVar: "Named faculty listed",
    labVar: "Research lab listed",
    sonuc: (n, toplam, ulkeN) => `${n} of ${toplam} programmes · ${ulkeN} countries`,
    bos: "No programme matches these filters.",
    kDerece: "Degree", kSure: "Duration", kEcts: "ECTS", kDil: "Language", kUcret: "Tuition",
    kMyo: "Level", yil: "yr",
    dersler: "Courses / curriculum", lab: "Research labs & facilities", hoca: "Faculty",
    kadro: "Faculty listing policy", sayfa: "Programme page", kaynak: "Sources",
    bolgeNot: "note",
    bologna: "(Bologna 60 ECTS/yr)",
    altbilgi1: "Compiled by Güvenç Usanmaz.",
    altbilgi2: "Content is licensed CC BY 4.0 — reuse it freely with attribution. Corrections and additions are welcome via pull request; see CONTRIBUTING.md."
  },
  tr: {
    marka: "· yükseköğretimde oyun programları",
    baslik: "Oyun geliştirme nerede, kimler tarafından öğretiliyor",
    ozet: "",
    pdf: "PDF", md: "Markdown", repo: "GitHub", katki: "Katkı ver",
    ara: "Kurum, şehir, ders, hoca, laboratuvar ara…",
    ulke: "Ülke", sinir: "Süzgeç",
    hepsi: "Tüm ülkeler", sinirHepsi: "Süzgeç yok",
    oyunBolum: "Ayrı oyun bölümü", ingilizce: "İngilizce eğitim",
    myoSeviye: "MYO / ön lisans düzeyi", hocaVar: "Öğretim üyesi ismen var",
    labVar: "Araştırma laboratuvarı var",
    sonuc: (n, toplam, ulkeN) => `${n} / ${toplam} program · ${ulkeN} ülke`,
    bos: "Bu süzgeçlere uyan program yok.",
    kDerece: "Derece", kSure: "Süre", kEcts: "AKTS", kDil: "Dil", kUcret: "Ücret",
    kMyo: "Düzey", yil: "yıl",
    dersler: "Dersler / müfredat", lab: "Araştırma laboratuvarları ve tesisler", hoca: "Öğretim üyeleri",
    kadro: "Öğretim kadrosu politikası", sayfa: "Program sayfası", kaynak: "Kaynaklar",
    bolgeNot: "not",
    bologna: "(Bologna 60 AKTS/yıl)",
    altbilgi1: "Güvenç Usanmaz tarafından derlendi.",
    altbilgi2: "İçerik CC BY 4.0 ile lisanslı — atıf vererek serbestçe kullanabilirsiniz. Düzeltme ve eklemeler pull request ile memnuniyetle karşılanır; CONTRIBUTING.md dosyasına bakın."
  }
};

const P = window.ATLAS.programlar;
let dil = (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";
const durum = { q: "", ulke: "", sinir: "" };

const BAYRAK = {
  ABD: "🇺🇸", Almanya: "🇩🇪", Avustralya: "🇦🇺", Avusturya: "🇦🇹", Azerbaycan: "🇦🇿",
  BAE: "🇦🇪", Bahreyn: "🇧🇭", Belcika: "🇧🇪", "Birlesik Krallik": "🇬🇧",
  "Cek Cumhuriyeti": "🇨🇿", Cin: "🇨🇳", Danimarka: "🇩🇰", Ermenistan: "🇦🇲",
  Estonya: "🇪🇪", Finlandiya: "🇫🇮", Fransa: "🇫🇷", Gurcistan: "🇬🇪",
  "Guney Kore": "🇰🇷", Hirvatistan: "🇭🇷", Hollanda: "🇳🇱", "Hong Kong": "🇭🇰",
  Irlanda: "🇮🇪", Ispanya: "🇪🇸", Israil: "🇮🇱", Isvec: "🇸🇪", Isvicre: "🇨🇭",
  Italya: "🇮🇹", Izlanda: "🇮🇸", Japonya: "🇯🇵", Kanada: "🇨🇦", Katar: "🇶🇦",
  Letonya: "🇱🇻", Litvanya: "🇱🇹", Macaristan: "🇭🇺", Malta: "🇲🇹", Norvec: "🇳🇴",
  Polonya: "🇵🇱", Portekiz: "🇵🇹", Romanya: "🇷🇴", Rusya: "🇷🇺", Singapur: "🇸🇬",
  Slovenya: "🇸🇮", "Suudi Arabistan": "🇸🇦", Tayvan: "🇹🇼", Turkiye: "🇹🇷",
  Ukrayna: "🇺🇦", Umman: "🇴🇲", "Yeni Zelanda": "🇳🇿", Yunanistan: "🇬🇷",
};

const $ = s => document.querySelector(s);
const kaç = e => String(e == null ? "" : e).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const T = () => METIN[dil];
const ulkeAdi = p => (dil === "tr" ? p.ulkeTR : p.ulkeEN);
const bayrak = k => BAYRAK[k] ? BAYRAK[k] + " " : "";

function süz() {
  const q = durum.q.trim().toLowerCase()
    .normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  return P.filter(p =>
    (!q || p.q.includes(q)) &&
    (!durum.ulke || p.ulke === durum.ulke) &&
    (!durum.sinir || (
      (durum.sinir === "oyun" && p.odak === "Yuksek") ||
      (durum.sinir === "ingilizce" && p.ingilizce) ||
      (durum.sinir === "myo" && !!p.myo) ||
      (durum.sinir === "hoca" && p.hoca.length > 0) ||
      (durum.sinir === "lab" && p.lab.length > 0))));
}

function çipler() {
  const sayım = {};
  P.forEach(p => { sayım[p.ulke] = (sayım[p.ulke] || 0) + 1; });
  const sıra = Object.keys(sayım).sort((a, b) => {
    const aTr = dil === "tr" ? (P.find(p => p.ulke === a) || {}).ulkeTR || a
                             : (P.find(p => p.ulke === a) || {}).ulkeEN || a;
    const bTr = dil === "tr" ? (P.find(p => p.ulke === b) || {}).ulkeTR || b
                             : (P.find(p => p.ulke === b) || {}).ulkeEN || b;
    return aTr.localeCompare(bTr, dil === "tr" ? "tr" : "en");
  });
  const ad = k => dil === "tr" ? (P.find(p => p.ulke === k) || {}).ulkeTR
                               : (P.find(p => p.ulke === k) || {}).ulkeEN;

  $("#ulkeler").innerHTML =
    `<label class="etiket" for="ulke-sec">${kaç(T().ulke)}</label>` +
    `<select class="sec" id="ulke-sec" aria-label="${kaç(T().ulke)}">` +
    `<option value="">${kaç(T().hepsi)}</option>` +
    sıra.map(k =>
      `<option value="${kaç(k)}"${durum.ulke === k ? " selected" : ""}>` +
      `${bayrak(k)}${kaç(ad(k))} (${sayım[k]})</option>`).join("") +
    `</select>`;

  const anahtar = [["oyun", T().oyunBolum], ["ingilizce", T().ingilizce],
                   ["myo", T().myoSeviye], ["hoca", T().hocaVar], ["lab", T().labVar]];
  $("#sinirlar").innerHTML =
    `<label class="etiket" for="sinir-sec">${kaç(T().sinir)}</label>` +
    `<select class="sec" id="sinir-sec" aria-label="${kaç(T().sinir)}">` +
    `<option value="">${kaç(T().sinirHepsi)}</option>` +
    anahtar.map(([k, e]) =>
      `<option value="${k}"${durum.sinir === k ? " selected" : ""}>${kaç(e)}</option>`).join("") +
    `</select>`;
}

function alan(p, trKey, enKey) {
  if (dil === "en") return p[enKey] || p[trKey] || "";
  return p[trKey] || "";
}

function kart(p) {
  const t = T();
  const sehir = alan(p, "sehir", "sehirEN");
  const program = alan(p, "program", "programEN");
  const derece = alan(p, "derece", "dereceEN");
  const egitimDili = alan(p, "dil", "dilEN");
  const ucret = alan(p, "ucret", "ucretEN");
  const myo = alan(p, "myo", "myoEN");
  const not = alan(p, "not", "notEN");
  const hocaNot = alan(p, "hocaNot", "hocaNotEN");
  const dersList = dil === "en" ? (p.derslerEN || p.dersler || []) : (p.dersler || []);

  const rozet = [];
  if (p.odak === "Yuksek" || p.odak === "Orta") {
    const [tr, en] = p.odak === "Yuksek" ? ["oyun bölümü", "game programme"]
                                         : ["oyun dersleri", "game courses"];
    rozet.push(`<span class="rozet oyun">${kaç(dil === "tr" ? tr : en)}</span>`);
  }
  if (p.myo) rozet.push(`<span class="rozet myo">${kaç(t.myoSeviye)}</span>`);
  if (p.ingilizce) rozet.push(`<span class="rozet dil">${kaç(t.ingilizce)}</span>`);

  const meta = [];
  if (derece) meta.push(`<span><b>${kaç(t.kDerece)}</b>${kaç(derece)}</span>`);
  if (p.sure) meta.push(`<span><b>${kaç(t.kSure)}</b>${p.sure} ${kaç(t.yil)}</span>`);
  if (p.ects) meta.push(`<span><b>${kaç(t.kEcts)}</b>${p.ects}${p.ectsNot ? ` <em>${kaç(t.bologna)}</em>` : ""}</span>`);
  if (egitimDili) meta.push(`<span><b>${kaç(t.kDil)}</b>${kaç(egitimDili)}</span>`);
  if (ucret) meta.push(`<span><b>${kaç(t.kUcret)}</b>${kaç(ucret)}</span>`);
  if (myo) meta.push(`<span><b>${kaç(t.kMyo)}</b>${kaç(myo)}</span>`);

  const katla = (baslik, içerik) =>
    içerik ? `<details><summary>${kaç(baslik)}</summary>${içerik}</details>` : "";

  const dersler = dersList.length
    ? `<ul>${dersList.map(d => `<li>${kaç(d)}</li>`).join("")}</ul>` : "";
  const lab = p.lab.length
    ? `<ul>${p.lab.map(l => {
        const ad = dil === "en" ? (l.adEN || l.ad) : l.ad;
        return `<li>${l.url ? `<a href="${kaç(l.url)}" target="_blank" rel="noopener">${kaç(ad)}</a>` : kaç(ad)}</li>`;
      }).join("")}</ul>` : "";
  const hoca = p.hoca.length
    ? `<ul>${p.hoca.map(h => {
        const ad = h.url ? `<a href="${kaç(h.url)}" target="_blank" rel="noopener">${kaç(h.ad)}</a>` : kaç(h.ad);
        const unvan = dil === "en" ? (h.unvanEN || h.unvan) : h.unvan;
        const alanH = dil === "en" ? (h.alanEN || h.alan) : h.alan;
        const ek = [unvan, alanH].filter(Boolean).map(kaç).join(" — ");
        return `<li class="kişi"><b>${ad}</b>${ek ? ` <em>— ${ek}</em>` : ""}</li>`;
      }).join("")}</ul>` : "";

  const sınıflar = ["kart"];
  if (p.odak === "Yuksek") sınıflar.push("odak-yuksek");
  else if (p.odak === "Orta") sınıflar.push("odak-orta");
  if (p.myo) sınıflar.push("myo-var");

  return `<article class="${sınıflar.join(" ")}">
    <div class="kart-üst">
      <h2>${kaç(p.kurum)}</h2>
      <div class="yer">${kaç(sehir)}${sehir ? " · " : ""}${bayrak(p.ulke)}${kaç(ulkeAdi(p))}</div>
    </div>
    ${rozet.length ? `<div class="rozetler">${rozet.join("")}</div>` : ""}
    ${program ? `<div class="prog">${kaç(program)}</div>` : ""}
    ${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}
    ${katla(t.dersler, dersler)}
    ${katla(t.lab, lab)}
    ${katla(t.hoca, hoca)}
    ${!p.hoca.length && hocaNot ? `<details><summary>${kaç(t.kadro)}</summary><p>${kaç(hocaNot)}</p></details>` : ""}
    ${not ? `<p class="açıklama">${kaç(not)}</p>` : ""}
    ${p.url ? `<p class="sayfa-bağ"><a href="${kaç(p.url)}" target="_blank" rel="noopener">${kaç(t.sayfa)} →</a></p>` : ""}
    ${p.kaynaklar.length ? `<p class="kaynak">${kaç(t.kaynak)}: ${p.kaynaklar.map(k => `<a href="${kaç(k)}" target="_blank" rel="noopener">${kaç(k)}</a>`).join(" · ")}</p>` : ""}
  </article>`;
}

function çiz() {
  const sonuç = süz();
  const ulkeN = new Set(P.map(p => p.ulke)).size;
  $("#sayac").textContent = T().sonuc(sonuç.length, P.length, ulkeN);
  $("#liste").innerHTML = sonuç.length
    ? sonuç.map(kart).join("")
    : `<p class="boş">${kaç(T().bos)}</p>`;
}

function dilUygula() {
  document.documentElement.lang = dil;
  document.documentElement.dataset.lang = dil;
  const ulkeN = new Set(P.map(p => p.ulke)).size;
  METIN.en.ozet = `A catalogue of higher-education programmes in game development, game design and game art — ${P.length} programmes across ${ulkeN} countries. Every record was verified from the institution's own website; sources are listed under each entry. Switch language anytime — UI and programme details are available in English and Turkish.`;
  METIN.tr.ozet = `Oyun geliştirme, oyun tasarımı ve oyun sanatı alanında yükseköğretim programları kataloğu — ${ulkeN} ülkede ${P.length} program. Her kayıt kurumun kendi sitesinden doğrulandı; kaynaklar her kaydın altında. Dil değiştirince arayüz ve program ayrıntıları İngilizce / Türkçe görünür.`;
  document.querySelectorAll("[data-t]").forEach(e => {
    const v = T()[e.dataset.t];
    if (typeof v === "string") e.textContent = v;
  });
  $("#ara").placeholder = T().ara;
  document.querySelectorAll(".dil button").forEach(b =>
    b.classList.toggle("açık", b.dataset.dil === dil));
  document.title = dil === "tr"
    ? `Oyun Eğitimi Atlası — ${ulkeN} ülkede ${P.length} yükseköğretim oyun programı`
    : `Game Education Atlas — ${P.length} higher-education game programmes across ${ulkeN} countries`;
  const pdf = $("#bag-pdf"), md = $("#bag-md");
  if (pdf) pdf.href = dil === "en"
    ? "https://github.com/gusanmaz/game-education-atlas/raw/main/catalogue/game-programmes.pdf"
    : "https://github.com/gusanmaz/game-education-atlas/raw/main/catalogue/oyun-programlari.pdf";
  if (md) md.href = dil === "en"
    ? "https://github.com/gusanmaz/game-education-atlas/blob/main/catalogue/GAME-PROGRAMMES.md"
    : "https://github.com/gusanmaz/game-education-atlas/blob/main/catalogue/OYUN-PROGRAMLARI.md";
  çipler(); çiz();
}

$("#ara").addEventListener("input", e => { durum.q = e.target.value; çiz(); });

document.addEventListener("change", e => {
  if (!e.target) return;
  if (e.target.id === "ulke-sec") { durum.ulke = e.target.value || ""; çiz(); }
  if (e.target.id === "sinir-sec") { durum.sinir = e.target.value || ""; çiz(); }
});

document.addEventListener("click", e => {
  const d = e.target.closest("[data-dil]");
  if (d) { dil = d.dataset.dil; try { localStorage.setItem("atlas-dil", dil); } catch (_) {} dilUygula(); }
});

$("#tema").addEventListener("click", () => {
  const kök = document.documentElement;
  const koyu = kök.dataset.theme === "dark" ||
    (!kök.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  kök.dataset.theme = koyu ? "light" : "dark";
  try { localStorage.setItem("atlas-tema", kök.dataset.theme); } catch (_) {}
});

try {
  const kt = localStorage.getItem("atlas-tema");
  if (kt) document.documentElement.dataset.theme = kt;
  const kd = localStorage.getItem("atlas-dil");
  if (kd) dil = kd;
} catch (_) {}

dilUygula();
</script>
</body>
</html>

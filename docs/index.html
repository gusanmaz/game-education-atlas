<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Education Atlas — higher-education game programmes worldwide</title>
<meta name="description" content="Higher-education game development, game design and game art programmes worldwide. Every record verified from the institution's own website.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #1b2430;
  --surface-0: #d9f2ea;
  --surface-1: #f7fffc;
  --surface-2: #c5e8dc;
  --line:      #1b2430;
  --line-soft: #9ec9b8;
  --text-1:    #1b2430;
  --text-2:    #3d534a;
  --text-3:    #5f7a6e;
  --accent:    #00a896;
  --accent-2:  #ff6b4a;
  --accent-bg: #b8f0e4;
  --accent-ink:#065f52;
  --amber-ink: #5c3b00;
  --amber-bg:  #ffe08a;
  --good:      #2f9e44;
  --hero-a:    #0b3d4a;
  --hero-b:    #127a6a;
  --hero-c:    #1aa68a;
  --shadow:    #1b2430;
  --grid:      rgba(27, 36, 48, 0.08);
  --font-d:    "Pixelify Sans", "Courier New", monospace;
  --font-b:    "IBM Plex Sans", system-ui, sans-serif;
  --px: 3px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e8fff6; --surface-0: #0a1620; --surface-1: #122433; --surface-2: #1a3344;
    --line: #3dffe0; --line-soft: #245066; --text-1: #e8fff6; --text-2: #a8cfc0; --text-3: #6f9a88;
    --accent: #3dffe0; --accent-2: #ff8a65; --accent-bg: #163a40; --accent-ink: #9af5e4;
    --amber-ink: #ffe08a; --amber-bg: #4a3810; --good: #5ddf7a;
    --hero-a: #061018; --hero-b: #0a2a32; --hero-c: #0e3d40; --shadow: #031018;
    --grid: rgba(61, 255, 224, 0.14);
  }
}
:root[data-theme="dark"] {
  --ink: #e8fff6; --surface-0: #0a1620; --surface-1: #122433; --surface-2: #1a3344;
  --line: #3dffe0; --line-soft: #245066; --text-1: #e8fff6; --text-2: #a8cfc0; --text-3: #6f9a88;
  --accent: #3dffe0; --accent-2: #ff8a65; --accent-bg: #163a40; --accent-ink: #9af5e4;
  --amber-ink: #ffe08a; --amber-bg: #4a3810; --good: #5ddf7a;
  --hero-a: #061018; --hero-b: #0a2a32; --hero-c: #0e3d40; --shadow: #031018;
  --grid: rgba(61, 255, 224, 0.14);
}
:root[data-theme="light"] {
  --ink: #1b2430; --surface-0: #d9f2ea; --surface-1: #f7fffc; --surface-2: #c5e8dc;
  --line: #1b2430; --line-soft: #9ec9b8; --text-1: #1b2430; --text-2: #3d534a; --text-3: #5f7a6e;
  --accent: #00a896; --accent-2: #ff6b4a; --accent-bg: #b8f0e4; --accent-ink: #065f52;
  --amber-ink: #5c3b00; --amber-bg: #ffe08a; --good: #2f9e44;
  --hero-a: #0b3d4a; --hero-b: #127a6a; --hero-c: #1aa68a; --shadow: #1b2430;
  --grid: rgba(27, 36, 48, 0.08);
}

* { box-sizing: border-box; image-rendering: pixelated; }
html { scroll-behavior: smooth; }
body {
  margin: 0; color: var(--text-1);
  font: 14.5px/1.45 var(--font-b);
  background-color: var(--surface-0);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 8px 8px;
}
a { color: var(--accent); }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

header {
  background: linear-gradient(180deg, var(--hero-a), var(--hero-b) 60%, var(--hero-c));
  color: #e8fff6; position: relative; overflow: hidden;
  border-bottom: var(--px) solid var(--ink);
}
header::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 7px, rgba(255,255,255,0.04) 7px, rgba(255,255,255,0.04) 8px),
    linear-gradient(90deg, transparent 0 70%, rgba(255,107,74,0.18) 70% 72%, transparent 72%),
    radial-gradient(circle at 18% 70%, rgba(61,255,224,0.2) 0 2px, transparent 3px),
    radial-gradient(circle at 22% 62%, rgba(61,255,224,0.2) 0 2px, transparent 3px),
    radial-gradient(circle at 80% 30%, rgba(255,224,138,0.25) 0 3px, transparent 4px);
  background-size: auto, auto, 40px 40px, 40px 40px, 50px 50px;
  animation: twinkle 2.4s steps(2) infinite;
}
@keyframes twinkle { 50% { opacity: 0.7; } }
.üst {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px 18px; padding: 10px 0; flex-wrap: nowrap;
  min-height: 44px;
}
.üst-sol { display: flex; align-items: flex-start; gap: 10px; min-width: 0; flex: 1 1 auto; }
.üst-sağ {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 6px; flex: 0 1 auto; min-width: 0;
}
.üst-kontroller {
  display: flex; align-items: center; justify-content: flex-end;
  gap: 8px; flex-wrap: wrap;
}
.marka-blok {
  display: grid;
  grid-template-columns: 32px 1fr;
  column-gap: 12px; row-gap: 2px;
  align-items: center; min-width: 0;
}
.marka-blok::before {
  content: ""; width: 32px; height: 32px; grid-row: 1 / span 2; grid-column: 1;
  align-self: center;
  background:
    linear-gradient(var(--accent-2), var(--accent-2)) 0 0 / 9px 9px no-repeat,
    linear-gradient(#ffe08a, #ffe08a) 9px 0 / 14px 9px no-repeat,
    linear-gradient(var(--accent-2), var(--accent-2)) 23px 0 / 9px 9px no-repeat,
    linear-gradient(#3dffe0, #3dffe0) 5px 9px / 22px 12px no-repeat,
    linear-gradient(#1b2430, #1b2430) 9px 21px / 7px 11px no-repeat,
    linear-gradient(#1b2430, #1b2430) 18px 21px / 7px 11px no-repeat;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
  animation: bob 0.8s steps(2) infinite;
}
@keyframes bob { 50% { transform: translateY(2px); } }
.marka {
  grid-column: 2; grid-row: 1;
  font-family: var(--font-d); font-weight: 700;
  font-size: clamp(1.35rem, 2.8vw, 1.85rem); line-height: 1.05;
  letter-spacing: 0.01em; color: #fff;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
  white-space: nowrap;
}
.marka-alt {
  grid-column: 2; grid-row: 2;
  font-family: var(--font-d); font-weight: 600;
  font-size: clamp(0.88rem, 1.8vw, 1.05rem); line-height: 1.2;
  letter-spacing: 0.02em;
  color: rgba(232,255,246,0.82);
  text-shadow: 1px 1px 0 rgba(0,0,0,0.28);
  min-width: 0;
}
.üst .bağlar { display: flex; gap: 5px; flex-wrap: wrap; justify-content: flex-end; }
.düğme {
  font-family: var(--font-d); font-size: 13px; padding: 5px 10px; border-radius: 0;
  border: 2px solid rgba(255,255,255,0.55); background: rgba(0,0,0,0.22);
  color: #e8fff6; cursor: pointer;
}
.düğme:hover { background: rgba(255,255,255,0.14); }
.düğme.açık { background: var(--accent-2); border-color: #fff; color: #1b2430; }
#tema {
  font-size: 16px; line-height: 1; padding: 7px 12px;
  border-color: #fff; background: rgba(0, 0, 0, 0.38);
  box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.4);
}
#tema:hover {
  background: var(--accent-2); color: #1b2430; border-color: #fff;
  transform: translate(-1px, -1px); box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.45);
}
.dil { display: inline-flex; border: 2px solid rgba(255,255,255,0.55); }
.dil button { border: 0; border-radius: 0; background: transparent; }
.dil button + button { border-left: 2px solid rgba(255,255,255,0.55); }

.giriş { position: relative; z-index: 1; padding: 6px 0 12px; color: #e8fff6; }
.giriş h1 {
  font-family: var(--font-d); font-weight: 700;
  font-size: clamp(1.2rem, 2.3vw, 1.45rem); line-height: 1.3;
  margin: 0 0 6px; max-width: 36ch; color: #fff;
  text-shadow: 2px 2px 0 rgba(0,0,0,0.35);
}
.giriş p {
  margin: 0; color: rgba(232,255,246,0.82); font-size: 13px; line-height: 1.35;
  max-width: 68ch;
}
.bağ {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 0; font-size: 13px; font-weight: 700;
  font-family: var(--font-d); text-decoration: none;
  border: 2px solid #fff; color: #e8fff6; background: rgba(0,0,0,0.2);
  box-shadow: 2px 2px 0 rgba(0,0,0,0.35);
  transition: transform .1s steps(1), box-shadow .1s steps(1);
  white-space: nowrap;
}
.bağ.ana { background: var(--accent-2); border-color: #fff; color: #1b2430; }
.bağ:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 rgba(0,0,0,0.4); }
.bağ:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0,0,0,0.35); }
.px-ico {
  width: 18px; height: 18px; flex-shrink: 0;
  display: inline-block; vertical-align: middle;
  image-rendering: pixelated; image-rendering: crisp-edges;
  shape-rendering: crispEdges;
  border: 2px solid #1b2430;
  box-shadow: 1px 1px 0 rgba(0,0,0,0.35);
}
.bağ.ana .px-ico { border-color: #1b2430; }

.süzgeç {
  padding: 12px 0 8px; position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--surface-0) 94%, transparent);
  border-bottom: var(--px) solid var(--line);
}
.ara {
  width: 100%; font: inherit; padding: 9px 12px; border-radius: 0;
  border: var(--px) solid var(--line); background: var(--surface-1); color: var(--text-1);
  box-shadow: 3px 3px 0 var(--shadow);
}
.ara:focus { outline: none; border-color: var(--accent); box-shadow: 3px 3px 0 var(--accent); }
.filtre-satır { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.alan { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.etiket {
  font-family: var(--font-d); font-size: 13px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-3);
}
.sec {
  font: inherit; font-size: 13px; padding: 7px 28px 7px 9px; border-radius: 0;
  border: var(--px) solid var(--line); background: var(--surface-1); color: var(--text-1);
  width: 100%; min-width: 0; box-shadow: 3px 3px 0 var(--shadow);
  appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%231b2430' d='M1 1l5 5 5-5'/></svg>");
  background-repeat: no-repeat; background-position: right 9px center;
  cursor: pointer;
}
.sec:focus { outline: none; border-color: var(--accent); }
.sayaç {
  font-family: var(--font-d); font-size: 14px; font-weight: 600;
  color: var(--accent-ink); padding: 8px 0 0;
}

.liste { padding: 8px 0 16px; }
.sayfa-nav {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 6px; padding: 8px 0 40px;
}
.sayfa-nav .düğme {
  color: var(--text-1); border-color: var(--line);
  background: var(--surface-1); box-shadow: 2px 2px 0 var(--shadow);
}
.sayfa-nav .düğme:hover { background: var(--accent-bg); }
.sayfa-nav .düğme.açık {
  background: var(--accent-2); border-color: var(--ink); color: #1b2430;
}
.sayfa-nav .düğme:disabled {
  opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--shadow);
}
.sayfa-bilgi {
  font-family: var(--font-d); font-size: 13px; font-weight: 600;
  color: var(--text-2); min-width: 7ch; text-align: center;
}
.kart {
  border: var(--px) solid var(--line); border-radius: 0;
  padding: 11px 12px; margin: 10px 0;
  background: var(--surface-1);
  box-shadow: 4px 4px 0 var(--shadow);
  border-left: 6px solid var(--line-soft);
  transition: transform .1s steps(1), box-shadow .1s steps(1);
  animation: kartGir .4s steps(4) both;
}
.kart:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow); }
.kart.odak-yuksek { border-left-color: var(--accent); }
.kart.odak-orta { border-left-color: var(--accent-2); }
@keyframes kartGir {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.kart-üst {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  margin-bottom: 4px;
}
.kart h2 {
  font-family: var(--font-d); font-weight: 700; font-size: 17px;
  margin: 0; line-height: 1.3;
}
.yer { color: var(--text-3); font-size: 12px; }
.rozetler { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0 6px; }
.rozet {
  font-family: var(--font-d); font-size: 12px; font-weight: 600;
  padding: 3px 8px; border-radius: 0; letter-spacing: 0.02em;
  border: 2px solid var(--line); color: var(--text-2); background: var(--surface-2);
}
.rozet.oyun { color: var(--accent-ink); background: var(--accent-bg); border-color: var(--accent); }
.rozet.myo { color: #fff; background: var(--good); border-color: var(--ink); }
.rozet.dil { color: var(--amber-ink); background: var(--amber-bg); border-color: var(--ink); }
.prog { font-weight: 700; font-size: 13.5px; margin: 0 0 5px; line-height: 1.3; }
.meta {
  display: flex; flex-wrap: wrap; gap: 3px 0; margin: 0 0 4px;
  font-size: 12.5px; color: var(--text-2); line-height: 1.35;
}
.meta span + span::before { content: "·"; margin: 0 6px; color: var(--text-3); font-weight: 700; }
.meta b { font-weight: 600; color: var(--text-3); font-size: 11px; margin-right: 3px; }
.meta em { font-style: normal; color: var(--text-3); font-size: 11.5px; }
details { margin-top: 5px; border-top: 2px dashed var(--line-soft); padding-top: 4px; }
summary {
  cursor: pointer; font-size: 14px; font-weight: 700; color: var(--text-2);
  padding: 2px 0; list-style: none; font-family: var(--font-d);
}
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; color: var(--accent-2); }
details[open] summary::before { content: "▾ "; }
summary:hover { color: var(--text-1); }
details ul { margin: 4px 0 2px; padding-left: 16px; font-size: 13px; }
details li { margin: 1px 0; }
details p { font-size: 13px; margin: 4px 0 0; }
.kişi b { font-weight: 600; }
.kişi em { font-style: normal; color: var(--text-2); }
.açıklama {
  margin: 7px 0 0; padding: 7px 9px; background: var(--surface-2);
  border-radius: 0; font-size: 12.5px; color: var(--text-2); line-height: 1.4;
  border: 2px solid var(--line); border-left: 6px solid var(--accent-2);
}
.kaynak { margin: 5px 0 0; font-size: 11.5px; color: var(--text-3); word-break: break-all; }
.kaynak a { color: var(--text-3); }
.kaynak a:hover { color: var(--accent); }
.sayfa-bağ { margin: 7px 0 0; font-size: 15px; font-weight: 700; font-family: var(--font-d); }
.boş { text-align: center; padding: 40px 0; color: var(--text-2); font-family: var(--font-d); font-size: 15px; }

.rehber {
  padding: 10px 0 4px;
  background: color-mix(in srgb, var(--surface-0) 88%, var(--surface-2));
  border-bottom: var(--px) solid var(--line);
}
.rehber details {
  background: var(--surface-1); border: var(--px) solid var(--line);
  box-shadow: 3px 3px 0 var(--shadow); padding: 10px 14px 12px;
}
.rehber summary {
  cursor: pointer; font-family: var(--font-d); font-weight: 700; font-size: 16px;
  list-style: none; color: var(--text-1);
}
.rehber summary::-webkit-details-marker { display: none; }
.rehber summary::before { content: "+ "; color: var(--accent-2); }
.rehber details[open] summary::before { content: "− "; }
.rehber .rehber-gövde {
  margin-top: 10px; font-size: 13px; line-height: 1.5; color: var(--text-2); max-width: 72ch;
}
.rehber .rehber-gövde p { margin: 0 0 10px; }
.rehber .rehber-gövde a { color: var(--accent); font-weight: 600; }
.rehber-meta {
  margin-top: 12px; padding-top: 10px;
  border-top: 2px dashed var(--line-soft);
  font-family: var(--font-d); font-size: 13px; line-height: 1.45; color: var(--text-2);
}
.rehber-meta p { margin: 0 0 8px; max-width: 72ch; }
.rehber-meta p:last-child { margin-bottom: 0; }

footer {
  border-top: var(--px) solid var(--line); background: var(--surface-1);
  padding: 18px 0 28px; color: var(--text-2);
  font-family: var(--font-d); font-size: 13px; line-height: 1.45;
}
footer p { margin: 0 0 8px; max-width: 72ch; }
footer p:last-child { margin-bottom: 0; }
[hidden] { display: none !important; }

@media (max-width: 720px) {
  .wrap { padding: 0 12px; }
  .üst { flex-wrap: wrap; gap: 8px; padding: 10px 0 8px; }
  .üst-sol { flex: 1 1 100%; }
  .üst-sağ { flex: 1 1 100%; align-items: flex-start; }
  .üst .bağlar, .üst-kontroller { justify-content: flex-start; }
  .marka { font-size: 1.3rem; white-space: normal; }
  .marka-alt { white-space: normal; font-size: 0.95rem; }
  .giriş { padding: 4px 0 10px; }
  .giriş h1 { font-size: 1.2rem; max-width: none; }
  .filtre-satır { grid-template-columns: 1fr; }
  .kart { box-shadow: 3px 3px 0 var(--shadow); }
}
@media (prefers-reduced-motion: reduce) {
  .kart, .marka-blok::before, header::before { animation: none; }
  .bağ, .kart { transition: none; }
}
</style>
</head>

<script src="data.js"></script>
<script>
"use strict";

const METIN = {
  en: {

    ozet: "",
    pdf: "PDF", md: "Markdown", repo: "GitHub", katki: "Contribute", about: "About",

    oyunBolum: "Dedicated game programme", ingilizce: "Taught in English",

    labVar: "Research lab listed",
    sonuc: (n, toplam, ulkeN) => `${n} of ${toplam} programmes · ${ulkeN} countries`,
    sayfaAralik: (a, b, n) => `${a}–${b} / ${n}`,

    kMyo: "Level", yil: "yr",

    kadro: "Faculty listing policy", sayfa: "Programme page", kaynak: "Sources",

    altbilgi2: "AI-assisted research and drafting; information is not 100% guaranteed accurate or complete. Always verify on the institution’s site.",
    altbilgi3: "Corrections and additions via pull request are welcome and important — see CONTRIBUTING.md on GitHub."
  },
  tr: {
    marka: "yükseköğretimde oyun programları",
    baslik: "Oyun geliştirme nerede, kimler tarafından öğretiliyor",
    ozet: "",
    pdf: "PDF", md: "Markdown", repo: "GitHub", katki: "Katkı ver", about: "Hakkında",
    ara: "Kurum, şehir, ders, hoca, laboratuvar ara…",
    ulke: "Ülke", sinir: "Süzgeç",
    hepsi: "Tüm ülkeler", sinirHepsi: "Süzgeç yok",
    oyunBolum: "Ayrı oyun bölümü", ingilizce: "İngilizce eğitim",
    myoSeviye: "MYO / ön lisans düzeyi", hocaVar: "Öğretim üyesi ismen var",
    labVar: "Araştırma laboratuvarı var",
    sonuc: (n, toplam, ulkeN) => `${n} / ${toplam} program · ${ulkeN} ülke`,
    sayfaAralik: (a, b, n) => `${a}–${b} / ${n}`,
    onceki: "Önceki", sonraki: "Sonraki",
    bos: "Bu süzgeçlere uyan program yok.",
    kDerece: "Derece", kSure: "Süre", kEcts: "AKTS", kDil: "Dil", kUcret: "Ücret",
    kMyo: "Düzey", yil: "yıl",
    dersler: "Dersler / müfredat", lab: "Araştırma laboratuvarları ve tesisler", hoca: "Öğretim üyeleri",
    kadro: "Öğretim kadrosu politikası", sayfa: "Program sayfası", kaynak: "Kaynaklar",
    bolgeNot: "not",
    bologna: "(Bologna 60 AKTS/yıl)",
    rehberBaslik: "Bu rehber hakkında",
    rehber0: "Her kayıt kurumun kendi sitesinden kontrol edildi; kaynaklar kaydın altında. Arayüz ve program ayrıntıları İngilizce / Türkçe arasında değişir — dil düğmesini istediğiniz zaman kullanın. PDF ve Markdown indirmeleri de seçili dile göre gelir.",
    rehber1: "Game Education Atlas, yurt dışında oyun geliştirme eğitimi almak isteyen öğrenci ve profesyoneller için pratik bir yol arkadaşı olsun diye derlendi — sıralama tablosu değil. Bir kaydı açınca kurumların eğitim yolunu yan yana görebilirsiniz: örnek dersler, eğitim dili, derece türü, ücret notları, laboratuvarlar ve (yayınlanıyorsa) öğretim üyeleri.",
    rehber2: "Asıl işe yarayan kısım bu karşılaştırma: biri motor ve programlama ağırlıklı ilerler, biri sanat hattı veya oyun işletmesi, biri XR. Müfredat ve notlandırma/değerlendirme kültürüne dair hızlı bir ön bakış, her kurumun sitesindeki derin araştırmayı kısaltır.",
    rehber3: "Araştırma ve güncellemede yapay zekâdan yararlanıldı. Doğruluk yüzde yüz garanti edilmez — ücretler ve programlar değişir, eksikler olabilir. GitHub’da pull request ile düzeltme ve ekleme yapmak rehberi canlı tutmanın en iyi yoludur; katkılar gerçekten önemli.",
    altbilgi1: "Güvenç Usanmaz tarafından derlendi · Ağustos 2026 · CC BY 4.0.",
    altbilgi2: "Yapay zekâ destekli araştırma ve derleme; bilgilerin yüzde yüz doğruluğu veya eksiksizliği garanti edilmez. Başvuru öncesi kurum sitesinden teyit edin.",
    altbilgi3: "Düzeltme ve eklemeler pull request ile memnuniyetle karşılanır ve önemlidir — GitHub’daki CONTRIBUTING.md dosyasına bakın."
  }
};

const P = window.ATLAS.programlar;
const SAYFA_BOYUT = 10;
let dil = (navigator.language || "en").toLowerCase().startsWith("tr") ? "tr" : "en";
const durum = { q: "", ulke: "", sinir: "", sayfa: 1 };

const BAYRAK = {
  ABD: "🇺🇸", Almanya: "🇩🇪", Avustralya: "🇦🇺", Avusturya: "🇦🇹", Azerbaycan: "🇦🇿",
  BAE: "🇦🇪", Bahreyn: "🇧🇭", Belcika: "🇧🇪", "Birlesik Krallik": "🇬🇧",
  "Cek Cumhuriyeti": "🇨🇿", Cin: "🇨🇳", Danimarka: "🇩🇰", Ermenistan: "🇦🇲",
  Estonya: "🇪🇪", Finlandiya: "🇫🇮", Fransa: "🇫🇷", Gurcistan: "🇬🇪",
  "Guney Kibris": "🇨🇾", "Guney Kore": "🇰🇷", Hirvatistan: "🇭🇷", Hollanda: "🇳🇱", "Hong Kong": "🇭🇰",
  Irlanda: "🇮🇪", Ispanya: "🇪🇸", Israil: "🇮🇱", Isvec: "🇸🇪", Isvicre: "🇨🇭",
  Italya: "🇮🇹", Izlanda: "🇮🇸", Japonya: "🇯🇵", Kanada: "🇨🇦", Katar: "🇶🇦",
  "Kuzey Kibris": "🇹🇷",
  Letonya: "🇱🇻", Litvanya: "🇱🇹", Macaristan: "🇭🇺", Malta: "🇲🇹", Norvec: "🇳🇴",
  Polonya: "🇵🇱", Portekiz: "🇵🇹", Romanya: "🇷🇴", Rusya: "🇷🇺", Singapur: "🇸🇬",
  Slovenya: "🇸🇮", "Suudi Arabistan": "🇸🇦", Tayvan: "🇹🇼", Turkiye: "🇹🇷",
  Ukrayna: "🇺🇦", Umman: "🇴🇲", "Yeni Zelanda": "🇳🇿", Yunanistan: "🇬🇷",
};

const $ = s => document.querySelector(s);
const kaç = e => String(e == null ? "" : e).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const T = () => METIN[dil];
const ulkeAdi = p => (dil === "tr" ? p.ulkeTR : p.ulkeEN);
const bayrak = k => BAYRAK[k] ? BAYRAK[k] + " " : "";

function süz() {
  const q = durum.q.trim().toLowerCase()
    .normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
  return P.filter(p =>
    (!q || p.q.includes(q)) &&
    (!durum.ulke || p.ulke === durum.ulke) &&
    (!durum.sinir || (
      (durum.sinir === "oyun" && p.odak === "Yuksek") ||
      (durum.sinir === "ingilizce" && p.ingilizce) ||
      (durum.sinir === "myo" && !!p.myo) ||
      (durum.sinir === "hoca" && p.hoca.length > 0) ||
      (durum.sinir === "lab" && p.lab.length > 0))));
}

function çipler() {
  const sayım = {};
  P.forEach(p => { sayım[p.ulke] = (sayım[p.ulke] || 0) + 1; });
  const sıra = Object.keys(sayım).sort((a, b) => {
    const aTr = dil === "tr" ? (P.find(p => p.ulke === a) || {}).ulkeTR || a
                             : (P.find(p => p.ulke === a) || {}).ulkeEN || a;
    const bTr = dil === "tr" ? (P.find(p => p.ulke === b) || {}).ulkeTR || b
                             : (P.find(p => p.ulke === b) || {}).ulkeEN || b;
    return aTr.localeCompare(bTr, dil === "tr" ? "tr" : "en");
  });
  const ad = k => dil === "tr" ? (P.find(p => p.ulke === k) || {}).ulkeTR
                               : (P.find(p => p.ulke === k) || {}).ulkeEN;

  $("#ulkeler").innerHTML =
    `<label class="etiket" for="ulke-sec">${kaç(T().ulke)}</label>` +
    `<select class="sec" id="ulke-sec" aria-label="${kaç(T().ulke)}">` +
    `<option value="">${kaç(T().hepsi)}</option>` +
    sıra.map(k =>
      `<option value="${kaç(k)}"${durum.ulke === k ? " selected" : ""}>` +
      `${bayrak(k)}${kaç(ad(k))} (${sayım[k]})</option>`).join("") +
    `</select>`;

  const anahtar = [["oyun", T().oyunBolum], ["ingilizce", T().ingilizce],
                   ["myo", T().myoSeviye], ["hoca", T().hocaVar], ["lab", T().labVar]];
  $("#sinirlar").innerHTML =
    `<label class="etiket" for="sinir-sec">${kaç(T().sinir)}</label>` +
    `<select class="sec" id="sinir-sec" aria-label="${kaç(T().sinir)}">` +
    `<option value="">${kaç(T().sinirHepsi)}</option>` +
    anahtar.map(([k, e]) =>
      `<option value="${k}"${durum.sinir === k ? " selected" : ""}>${kaç(e)}</option>`).join("") +
    `</select>`;
}

function alan(p, trKey, enKey) {
  if (dil === "en") return p[enKey] || p[trKey] || "";
  return p[trKey] || "";
}

function kart(p) {
  const t = T();
  const sehir = alan(p, "sehir", "sehirEN");
  const program = alan(p, "program", "programEN");
  const derece = alan(p, "derece", "dereceEN");
  const egitimDili = alan(p, "dil", "dilEN");
  const ucret = alan(p, "ucret", "ucretEN");
  const myo = alan(p, "myo", "myoEN");
  const not = alan(p, "not", "notEN");
  const hocaNot = alan(p, "hocaNot", "hocaNotEN");
  const dersList = dil === "en" ? (p.derslerEN || p.dersler || []) : (p.dersler || []);

  const rozet = [];
  if (p.odak === "Yuksek" || p.odak === "Orta") {
    const [tr, en] = p.odak === "Yuksek" ? ["oyun bölümü", "game programme"]
                                         : ["oyun dersleri", "game courses"];
    rozet.push(`<span class="rozet oyun">${kaç(dil === "tr" ? tr : en)}</span>`);
  }
  if (p.myo) rozet.push(`<span class="rozet myo">${kaç(t.myoSeviye)}</span>`);
  if (p.ingilizce) rozet.push(`<span class="rozet dil">${kaç(t.ingilizce)}</span>`);

  const meta = [];
  if (derece) meta.push(`<span><b>${kaç(t.kDerece)}</b>${kaç(derece)}</span>`);
  if (p.sure) meta.push(`<span><b>${kaç(t.kSure)}</b>${p.sure} ${kaç(t.yil)}</span>`);
  if (p.ects) meta.push(`<span><b>${kaç(t.kEcts)}</b>${p.ects}${p.ectsNot ? ` <em>${kaç(t.bologna)}</em>` : ""}</span>`);
  if (egitimDili) meta.push(`<span><b>${kaç(t.kDil)}</b>${kaç(egitimDili)}</span>`);
  if (ucret) meta.push(`<span><b>${kaç(t.kUcret)}</b>${kaç(ucret)}</span>`);
  if (myo) meta.push(`<span><b>${kaç(t.kMyo)}</b>${kaç(myo)}</span>`);

  const katla = (baslik, içerik) =>
    içerik ? `<details><summary>${kaç(baslik)}</summary>${içerik}</details>` : "";

  const dersler = dersList.length
    ? `<ul>${dersList.map(d => `<li>${kaç(d)}</li>`).join("")}</ul>` : "";
  const lab = p.lab.length
    ? `<ul>${p.lab.map(l => {
        const ad = dil === "en" ? (l.adEN || l.ad) : l.ad;
        return `<li>${l.url ? `<a href="${kaç(l.url)}" target="_blank" rel="noopener">${kaç(ad)}</a>` : kaç(ad)}</li>`;
      }).join("")}</ul>` : "";
  const hoca = p.hoca.length
    ? `<ul>${p.hoca.map(h => {
        const ad = h.url ? `<a href="${kaç(h.url)}" target="_blank" rel="noopener">${kaç(h.ad)}</a>` : kaç(h.ad);
        const unvan = dil === "en" ? (h.unvanEN || h.unvan) : h.unvan;
        const alanH = dil === "en" ? (h.alanEN || h.alan) : h.alan;
        const ek = [unvan, alanH].filter(Boolean).map(kaç).join(" — ");
        return `<li class="kişi"><b>${ad}</b>${ek ? ` <em>— ${ek}</em>` : ""}</li>`;
      }).join("")}</ul>` : "";

  const sınıflar = ["kart"];
  if (p.odak === "Yuksek") sınıflar.push("odak-yuksek");
  else if (p.odak === "Orta") sınıflar.push("odak-orta");
  if (p.myo) sınıflar.push("myo-var");

  return `<article class="${sınıflar.join(" ")}">
    <div class="kart-üst">
      <h2>${kaç(p.kurum)}</h2>
      <div class="yer">${kaç(sehir)}${sehir ? " · " : ""}${bayrak(p.ulke)}${kaç(ulkeAdi(p))}</div>
    </div>
    ${rozet.length ? `<div class="rozetler">${rozet.join("")}</div>` : ""}
    ${program ? `<div class="prog">${kaç(program)}</div>` : ""}
    ${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}
    ${katla(t.dersler, dersler)}
    ${katla(t.lab, lab)}
    ${katla(t.hoca, hoca)}
    ${!p.hoca.length && hocaNot ? `<details><summary>${kaç(t.kadro)}</summary><p>${kaç(hocaNot)}</p></details>` : ""}
    ${not ? `<p class="açıklama">${kaç(not)}</p>` : ""}
    ${p.url ? `<p class="sayfa-bağ"><a href="${kaç(p.url)}" target="_blank" rel="noopener">${kaç(t.sayfa)} →</a></p>` : ""}
    ${p.kaynaklar.length ? `<p class="kaynak">${kaç(t.kaynak)}: ${p.kaynaklar.map(k => `<a href="${kaç(k)}" target="_blank" rel="noopener">${kaç(k)}</a>`).join(" · ")}</p>` : ""}
  </article>`;
}

function çiz() {
  const sonuç = süz();
  const ulkeN = new Set(P.map(p => p.ulke)).size;
  const toplamSayfa = Math.max(1, Math.ceil(sonuç.length / SAYFA_BOYUT));
  if (durum.sayfa > toplamSayfa) durum.sayfa = toplamSayfa;
  if (durum.sayfa < 1) durum.sayfa = 1;
  const baş = (durum.sayfa - 1) * SAYFA_BOYUT;
  const dilim = sonuç.slice(baş, baş + SAYFA_BOYUT);
  const a = sonuç.length ? baş + 1 : 0;
  const b = baş + dilim.length;

  $("#sayac").textContent = T().sonuc(sonuç.length, P.length, ulkeN);
  $("#liste").innerHTML = sonuç.length
    ? dilim.map(kart).join("")
    : `<p class="boş">${kaç(T().bos)}</p>`;

  const nav = $("#sayfa-nav");
  if (!sonuç.length || toplamSayfa <= 1) {
    nav.hidden = true;
    nav.innerHTML = "";
    return;
  }
  nav.hidden = false;
  const t = T();
  const maxBtn = 7;
  let from = Math.max(1, durum.sayfa - 3);
  let to = Math.min(toplamSayfa, from + maxBtn - 1);
  from = Math.max(1, to - maxBtn + 1);
  let sayfalar = "";
  for (let i = from; i <= to; i++) {
    sayfalar += `<button type="button" class="düğme${i === durum.sayfa ? " açık" : ""}" data-sayfa="${i}">${i}</button>`;
  }
  nav.innerHTML =
    `<button type="button" class="düğme" data-sayfa="${durum.sayfa - 1}" ${durum.sayfa <= 1 ? "disabled" : ""}>${kaç(t.onceki)}</button>` +
    sayfalar +
    `<button type="button" class="düğme" data-sayfa="${durum.sayfa + 1}" ${durum.sayfa >= toplamSayfa ? "disabled" : ""}>${kaç(t.sonraki)}</button>` +
    `<span class="sayfa-bilgi">${kaç(t.sayfaAralik(a, b, sonuç.length))}</span>`;
}

function dilUygula() {
  document.documentElement.lang = dil;
  document.documentElement.dataset.lang = dil;
  const ulkeN = new Set(P.map(p => p.ulke)).size;
  METIN.en.ozet = `A catalogue of higher-education programmes in game development, game design and game art — ${P.length} programmes across ${ulkeN} countries.`;
  METIN.tr.ozet = `Oyun geliştirme, oyun tasarımı ve oyun sanatı alanında yükseköğretim programları kataloğu — ${ulkeN} ülkede ${P.length} program.`;
  document.querySelectorAll("[data-t]").forEach(e => {
    const v = T()[e.dataset.t];
    if (typeof v === "string") e.textContent = v;
  });
  $("#ara").placeholder = T().ara;
  document.querySelectorAll(".dil button").forEach(b =>
    b.classList.toggle("açık", b.dataset.dil === dil));
  document.title = dil === "tr"
    ? `Oyun Eğitimi Atlası — ${ulkeN} ülkede ${P.length} yükseköğretim oyun programı`
    : `Game Education Atlas — ${P.length} higher-education game programmes across ${ulkeN} countries`;
  const pdf = $("#bag-pdf"), md = $("#bag-md");
  if (pdf) pdf.href = dil === "en"
    ? "https://github.com/gusanmaz/game-education-atlas/raw/main/catalogue/game-programmes.pdf"
    : "https://github.com/gusanmaz/game-education-atlas/raw/main/catalogue/oyun-programlari.pdf";
  if (md) md.href = dil === "en"
    ? "https://github.com/gusanmaz/game-education-atlas/blob/main/catalogue/GAME-PROGRAMMES.md"
    : "https://github.com/gusanmaz/game-education-atlas/blob/main/catalogue/OYUN-PROGRAMLARI.md";
  çipler(); çiz();
}

function sayfaSıfırla() { durum.sayfa = 1; }

$("#ara").addEventListener("input", e => { durum.q = e.target.value; sayfaSıfırla(); çiz(); });

document.addEventListener("change", e => {
  if (!e.target) return;
  if (e.target.id === "ulke-sec") { durum.ulke = e.target.value || ""; sayfaSıfırla(); çiz(); }
  if (e.target.id === "sinir-sec") { durum.sinir = e.target.value || ""; sayfaSıfırla(); çiz(); }
});

document.addEventListener("click", e => {
  const d = e.target.closest("[data-dil]");
  if (d) { dil = d.dataset.dil; try { localStorage.setItem("atlas-dil", dil); } catch (_) {} dilUygula(); }
  const s = e.target.closest("[data-sayfa]");
  if (s && !s.disabled) {
    const n = Number(s.dataset.sayfa);
